<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypotenuse Analytics | Redirecting</title>

  <!-- Redirect to first slide -->
  <meta http-equiv="refresh" content="0; url=page-1.html">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #eef8fc;
      color: #0b2a5b;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 6px solid #d9f3f7;
      border-top: 6px solid #16c6d8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    p {
      margin-top: 10px;
      font-size: 16px;
    }

    a {
      margin-top: 20px;
      color: #16c6d8;
      text-decoration: none;
      font-weight: bold;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="loader"></div>

  <h1>Hypotenuse Analytics</h1>
  <p>Redirecting to Pitch Deck...</p>

  <a href="page-1.html">Click here if not redirected</a>

</body>
</html>
